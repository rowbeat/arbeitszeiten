<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Katharina Arbeitszeiten</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}
input {
    padding: 10px;
    font-size: 18px;
    width: 160px;
}
button {
    padding: 12px;
    font-size: 18px;
    margin-top: 10px;
}
</style>

<script>
// -------------------------------
// KONFIGURATION (DEINE WERTE)
// -------------------------------
const CLIENT_ID = "3b4ebf1f-8107-477c-9368-fb76ba2169c7";
const TENANT_ID = "e19f9f5c-569f-487f-8ca5-5fc648224536";
const FILE_ID = "c/6132f13d2296c3cc/IQAHuJPsDiFrQZFsMI0nKw2SAasC5KlZt7DfdNQ2FZlC_rY";

// Tabellenblatt + Zellen (Beispiel)
const SHEET = "Quartal 2";
const CELL_START = "D20";
const CELL_END = "G20";

// -------------------------------
// LOGIN FLOW
// -------------------------------
async function login() {
    const redirectUri = window.location.href;

    const authUrl =
        `https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize` +
        `?client_id=${CLIENT_ID}` +
        `&response_type=code` +
        `&redirect_uri=${encodeURIComponent(redirectUri)}` +
        `&response_mode=query` +
        `&scope=offline_access%20Files.ReadWrite%20Files.ReadWrite.All%20User.Read`;

    window.location = authUrl;
}

async function exchangeCodeForToken(code) {
    const redirectUri = window.location.href;

    const body =
        `client_id=${CLIENT_ID}` +
        `&grant_type=authorization_code` +
        `&code=${code}` +
        `&redirect_uri=${encodeURIComponent(redirectUri)}`;

    const response = await fetch(`https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body
    });

    const data = await response.json();
    localStorage.setItem("refresh_token", data.refresh_token);
    alert("Login erfolgreich! Du kannst jetzt Zeiten eintragen.");
}

async function getAccessToken() {
    const refresh = localStorage.getItem("refresh_token");
    if (!refresh) {
        alert("Bitte zuerst einloggen!");
        return null;
    }

    const body =
        `client_id=${CLIENT_ID}` +
        `&grant_type=refresh_token` +
        `&refresh_token=${refresh}`;

    const response = await fetch(`https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body
    });

    const data = await response.json();
    return data.access_token;
}

// -------------------------------
// IN EXCEL SCHREIBEN
// -------------------------------
async function writeToExcel(start, end) {
    const token = await getAccessToken();
    if (!token) return;

    const url =
        `https://graph.microsoft.com/v1.0/me/drive/items/${FILE_ID}/workbook/worksheets('${SHEET}')/range(address='${CELL_START}:${CELL_END}')`;

    const body = {
        values: [[start, end]]
    };

    const response = await fetch(url, {
        method: "PATCH",
        headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
    });

    if (response.ok) {
        alert("Zeiten erfolgreich gespeichert!");
    } else {
        alert("Fehler beim Schreiben in Excel.");
    }
}

// -------------------------------
// URL CODE HANDLING
// -------------------------------
window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    if (params.has("code")) {
        exchangeCodeForToken(params.get("code"));
    }
};
</script>
</head>

<body>

<h2>Katharina – Arbeitszeiten</h2>

<button onclick="login()">Einmalig einloggen (nur Robert)</button>

<h3>Zeiten eintragen</h3>
Start: <input id="start" type="time"><br><br>
Ende: <input id="end" type="time"><br><br>

<button onclick="writeToExcel(document.getElementById('start').value, document.getElementById('end').value)">
Speichern
</button>

</body>
</html>
