<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbeitszeiten Vucinic</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Arbeitszeiten erfassen</h2>

        <!-- LOGIN BUTTON -->
        <button onclick="login()">Einmalig einloggen</button>

        <h3>Zeiten eingeben</h3>

        <label>Datum:</label>
        <input type="date" id="date">

        <label>Startzeit:</label>
        <input type="time" id="start">

        <label>Endzeit:</label>
        <input type="time" id="end">

        <button onclick="saveToExcel()">Speichern</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
